<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Буквоград — кроссворд из букв</title>
<style>
:root{--bg1:#1d2b53;--bg2:#3b2f6b;--cell:#fffdf6;--cellE:rgba(255,255,255,.18);--ink:#22223b;--acc:#ffb703;--acc2:#fb8500;--ok:#52b788}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;
 background:linear-gradient(160deg,var(--bg1),var(--bg2));touch-action:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
#top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.pill{background:rgba(0,0,0,.28);border-radius:20px;padding:6px 14px;font-weight:bold;font-size:18px}
#grid{flex:1 1 auto;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding:4px}
#gridIn{position:relative}
.c{position:absolute;border-radius:7px;background:var(--cellE);display:flex;align-items:center;justify-content:center;
 font-weight:bold;color:var(--ink);text-transform:uppercase;transition:background .25s,transform .25s}
.c.f{background:var(--cell)} .c.pop{transform:scale(1.18)} .c.h{background:#ffe8a3}
#word{height:44px;font-size:30px;font-weight:bold;letter-spacing:4px;text-transform:uppercase;display:flex;align-items:center}
#word span{background:rgba(255,255,255,.92);color:var(--ink);padding:2px 14px;border-radius:10px}
#word.bad span{animation:shake .35s;background:#ffadad} #word.dup span{background:#bde0fe} #word.bonus span{background:#b7e4c7}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#wheelBox{position:relative;flex:0 0 auto;margin-bottom:max(22px,3vh)}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:6px;vertical-align:-2px;background:radial-gradient(circle at 35% 35%,#ffe066,#f4a100);box-shadow:inset 0 0 0 2px #c77d00}
#wheel{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.12)}
.l{position:absolute;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;
 font-weight:bold;text-transform:uppercase;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:background .12s,transform .12s}
.l.s{background:var(--acc);transform:scale(1.08)}
svg{position:absolute;inset:0;pointer-events:none}
.btn{position:absolute;width:52px;height:52px;border-radius:50%;border:none;background:rgba(0,0,0,.3);color:#fff;font-size:24px;
 cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.btn small{font-size:11px;margin-top:2px}
.btn:active{transform:scale(.93)}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 16px;border-radius:14px;
 opacity:0;transition:opacity .3s;pointer-events:none;font-size:16px;white-space:nowrap}
#toast.on{opacity:1}
.ov{position:absolute;inset:0;background:rgba(10,10,30,.72);display:none;align-items:center;justify-content:center;z-index:5}
.ov.on{display:flex}
.card{background:#fff;color:var(--ink);border-radius:20px;padding:24px 28px;text-align:center;max-width:340px;width:86%}
.card h2{margin:0 0 8px} .card p{margin:6px 0 14px;color:#555}
.big{background:linear-gradient(var(--acc),var(--acc2));border:none;color:#fff;font-weight:bold;font-size:20px;border-radius:14px;
 padding:12px 22px;cursor:pointer;margin:4px;box-shadow:0 4px 0 #c96a00}
.big.alt{background:#8ecae6;box-shadow:0 4px 0 #4a8fb0}
#bonusList{font-size:14px;color:#666;max-height:180px;overflow:auto;text-align:left;margin-bottom:10px}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div class="pill" id="lvl">Уровень 1</div><div class="pill" id="coins">0</div></div>
  <div id="grid"><div id="gridIn"></div></div>
  <div id="word"></div>
  <div id="wheelBox"><div id="wheel"></div><svg id="lines"></svg></div>
  <div id="toast"></div>
</div>
<div class="ov" id="win"><div class="card">
  <h2>Отлично!</h2><p id="winTxt"></p>
  <button class="big" id="next">Дальше</button><br>
  <button class="big alt" id="dbl">×2 монеты за рекламу</button><br>
  <button class="big alt" id="share" style="display:none">Пригласить друзей</button>
</div></div>
<div class="ov" id="info"><div class="card">
  <h2 id="infoT"></h2><div id="infoB"></div>
  <button class="big" onclick="this.closest('.ov').classList.remove('on')">Ок</button>
</div></div>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
